<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>學生議會直播 - 表決畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional" rel="stylesheet">
<style>
  :root {
    --paper-alt: #fdfbf6;
    --ink: #2a2420;
    --wine: #7a2e2e;
    --wine-dark: #591f1f;
    --forest: #3f4d3a;
    --gold: #b08d57;
    --border-soft: #e4dac9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    overflow: auto;
    background: transparent;
    font-family: "Noto Serif TC", serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: relative; width: 100%; height: 100%; }

  #brand {
    position: absolute; top: 40px; right: 48px;
    display: flex; flex-direction: column; align-items: flex-end;
    background: rgba(42,20,20,0.55);
    padding: 14px 26px;
    border-radius: 8px;
    border: 1px solid rgba(176,141,87,0.5);
  }
  #brand .thusp-word {
    font-family: "EB Garamond", serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.32em;
    color: var(--gold);
  }
  #brand .brand-rule {
    width: 60px; height: 1px;
    background: var(--gold);
    opacity: 0.6;
    margin: 6px 0 4px;
  }
  #brand .brand-text {
    color: var(--paper-alt); font-family: "Noto Sans TC", sans-serif;
    font-weight: 600;
    font-size: 18px; letter-spacing: 0.06em; white-space: nowrap;
  }

  #agendaBanner {
    position: absolute; top: 40px; left: 48px; right: 460px;
    background: rgba(42,20,20,0.85);
    border-left: 4px solid var(--gold);
    padding: 14px 24px;
    border-radius: 4px;
  }
  #agendaTitle {
    color: var(--paper-alt);
    font-family: "Noto Sans TC", sans-serif;
    font-size: 27px; font-weight: 700;
    outline: none;
  }

  /* ---- 七部會人事同意權表決面板：固定在畫面右側，不佔用左側鏡頭空間 ---- */
  #voteBoxes {
    position: absolute;
    top: 150px; right: 40px;
    width: 800px;
    background: rgba(42,20,20,0.78);
    border: 1px solid rgba(176,141,87,0.5);
    border-radius: 10px;
    padding: 16px 22px 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .vr, .vr-header {
    display: grid;
    grid-template-columns: 196px 150px 150px 104px 100px;
    align-items: center;
    gap: 10px;
    padding: 11px 4px;
  }
  .vr { border-top: 1px solid rgba(176,141,87,0.22); }
  .vr-header {
    font-family: "Noto Sans TC", sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--gold);
  }
  .vr-header span:not(:first-child) { text-align: center; }
  .vr-name {
    font-family: "Noto Sans TC", sans-serif;
    font-size: 19px; font-weight: 700;
    color: var(--paper-alt);
  }
  .vr-metric {
    display: flex; align-items: baseline; justify-content: center; gap: 6px;
  }
  .vr-label {
    font-family: "Noto Sans TC", sans-serif;
    font-size: 15px; font-weight: 600; color: var(--gold);
    white-space: nowrap;
  }
  .vr-label.clickable { cursor: pointer; user-select: none; }
  .vr-label.clickable:hover { text-decoration: underline; text-underline-offset: 4px; }
  .vr-count {
    font-family: "EB Garamond", serif;
    font-size: 27px; font-weight: 700; color: var(--paper-alt);
    font-variant-numeric: tabular-nums;
    min-width: 30px; text-align: center;
    outline: none;
  }
  .vr-status {
    text-align: center;
    font-family: "Noto Sans TC", sans-serif;
    font-size: 16px; font-weight: 700;
    letter-spacing: 0.05em;
  }
  .vr-status.pass { color: #8fd18f; }
  .vr-status.fail { color: #e79a9a; }

  #bottomStack {
    position: absolute; left: 0; right: 0; bottom: 0;
  }
  .info-bar {
    background: linear-gradient(180deg, rgba(89,31,31,0.97) 0%, rgba(42,20,20,0.97) 100%);
    height: 96px;
    display: flex; align-items: center;
    padding: 0 40px; gap: 32px;
  }
  .clock {
    font-family: "EB Garamond", serif;
    font-variant-numeric: tabular-nums;
    font-size: 46px; font-weight: 700; color: var(--paper-alt);
    min-width: 210px;
  }
  .v-div { width: 1px; height: 44px; background: rgba(176,141,87,0.4); }
  .agenda-text {
    flex: 1; font-family: "Noto Sans TC", sans-serif;
    font-size: 30px; font-weight: 700; color: var(--paper-alt); outline: none;
  }
  .live-dot {
    display: flex; align-items: center; gap: 10px;
    font-family: "EB Garamond", serif; font-size: 22px; letter-spacing: 0.16em; color: var(--paper-alt);
  }
  .live-dot .dot {
    width: 14px; height: 14px; border-radius: 50%; background: #c0392b;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  [contenteditable="true"] { cursor: text; border-radius: 4px; padding: 2px 6px; margin: -2px -6px; }
  [contenteditable="true"]:hover { background: rgba(176,141,87,0.15); }
  [contenteditable="true"]:focus {
    background: rgba(176,141,87,0.25);
    box-shadow: 0 0 0 1px rgba(176,141,87,0.6);
  }
  .flash { animation: flash-update 900ms ease; }
  @keyframes flash-update { 0% { color: #ffe9b3; } 100% { color: inherit; } }


</style>
</head>
<body>
<div id="stage">

  <div id="brand">
    <span class="thusp-word">THUSP</span>
    <span class="brand-rule"></span>
    <span class="brand-text">東海大學第三十八屆學生議會</span>
  </div>

  <div id="agendaBanner">
    <div id="agendaTitle" contenteditable="true" spellcheck="false">擬請學生議會同意任命○○部部長</div>
  </div>

  <div id="voteBoxes">
    <div class="vr-header">
      <span>部門／職稱</span><span>同意</span><span>不同意</span><span>廢票</span><span>結果</span>
    </div>
    <div id="voteRows"></div>
  </div>

  <div id="bottomStack">
    <div class="info-bar">
      <div class="clock" id="datetime"></div>
      <div class="v-div"></div>
      <div class="agenda-text" id="agendaBottomText" contenteditable="true" spellcheck="false">表決中</div>
      <div class="live-dot"><span class="dot"></span>LIVE</div>
    </div>
  </div>

</div>

<script>
  const STORAGE_KEY = "thu-council-live-v1";
  const API_URL = "/api/live-state";

  function loadShared() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveLocal(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  async function fetchRemote() {
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }
  function postRemote(patch) {
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch),
    }).catch(() => {});
  }
  function saveShared(patch) {
    const state = loadShared();
    Object.assign(state, patch);
    saveLocal(state);
    postRemote(patch);
  }

  // ---- 七部會一級幹部人事同意權表決 ----
  const DEPARTMENTS = [
    { id: "xuequan", name: "學權部代理部長" },
    { id: "waiwu", name: "外務部代理部長" },
    { id: "xuehui", name: "學會部代理部長" },
    { id: "shetuan", name: "社團部代理部長" },
    { id: "xinwen", name: "新聞部代理部長" },
    { id: "zongwu", name: "總務部代理部長" },
    { id: "xuanwei", name: "選委會代理主委" },
  ];
  const stampLabels = { pass: "● 通過", fail: "● 不通過" };
  const deptStamp = {};

  const editableIds = ["agendaTitle", "agendaBottomText"];
  const state = loadShared();
  editableIds.forEach((id) => {
    const key = "vote_" + id;
    if (state[key] !== undefined) document.getElementById(id).textContent = state[key];
  });

  editableIds.forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener("blur", () => {
      saveShared({ ["vote_" + id]: el.textContent });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });
  });

  function renderDeptStatus(id) {
    const badge = document.querySelector('.vr-status[data-dept="' + id + '"]');
    const next = deptStamp[id] || "none";
    badge.classList.remove("pass", "fail");
    if (next === "none") {
      badge.textContent = "";
    } else {
      badge.textContent = stampLabels[next];
      badge.classList.add(next);
    }
  }
  function setDeptStamp(id, next) {
    deptStamp[id] = deptStamp[id] === next ? "none" : next;
    renderDeptStatus(id);
    saveShared({ ["vote_" + id + "_stamp"]: deptStamp[id] });
  }

  const voteRows = document.getElementById("voteRows");
  DEPARTMENTS.forEach((d) => {
    const row = document.createElement("div");
    row.className = "vr";
    row.innerHTML =
      '<span class="vr-name">' + d.name + '</span>' +
      '<span class="vr-metric"><span class="vr-label clickable" data-dept="' + d.id + '" data-vote="pass">同意</span>' +
      '<span class="vr-count" contenteditable="true" spellcheck="false" data-key="vote_' + d.id + '_agree">0</span></span>' +
      '<span class="vr-metric"><span class="vr-label clickable" data-dept="' + d.id + '" data-vote="fail">不同意</span>' +
      '<span class="vr-count" contenteditable="true" spellcheck="false" data-key="vote_' + d.id + '_disagree">0</span></span>' +
      '<span class="vr-metric"><span class="vr-count" contenteditable="true" spellcheck="false" data-key="vote_' + d.id + '_spoiled">0</span></span>' +
      '<span class="vr-status" data-dept="' + d.id + '"></span>';
    voteRows.appendChild(row);
  });

  // count cells: type + Enter to save, click to focus then Up/Down to nudge by 1
  document.querySelectorAll(".vr-count[data-key]").forEach((el) => {
    const key = el.dataset.key;
    if (state[key] !== undefined) el.textContent = state[key];
    el.addEventListener("blur", () => {
      saveShared({ [key]: el.textContent });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); return; }
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      let val = parseInt(el.textContent, 10);
      if (isNaN(val)) val = 0;
      val += e.key === "ArrowUp" ? 1 : -1;
      if (val < 0) val = 0;
      el.textContent = String(val);
      saveShared({ [key]: el.textContent });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    });
  });

  // 同意/不同意 labels: click to set/toggle that department's pass/fail result
  document.querySelectorAll(".vr-label.clickable[data-dept]").forEach((el) => {
    el.addEventListener("click", () => setDeptStamp(el.dataset.dept, el.dataset.vote));
  });

  DEPARTMENTS.forEach((d) => {
    deptStamp[d.id] = state["vote_" + d.id + "_stamp"] || "none";
    renderDeptStatus(d.id);
  });

  function applyState(s) {
    editableIds.forEach((id) => {
      const el = document.getElementById(id);
      const key = "vote_" + id;
      if (s[key] !== undefined && document.activeElement !== el && el.textContent !== s[key]) {
        el.textContent = s[key];
      }
    });
    document.querySelectorAll(".vr-count[data-key]").forEach((el) => {
      const key = el.dataset.key;
      if (s[key] !== undefined && document.activeElement !== el && el.textContent !== s[key]) {
        el.textContent = s[key];
      }
    });
    DEPARTMENTS.forEach((d) => {
      const key = "vote_" + d.id + "_stamp";
      if (s[key] !== undefined && s[key] !== deptStamp[d.id]) {
        deptStamp[d.id] = s[key];
        renderDeptStatus(d.id);
      }
    });
  }

  (async () => {
    const remote = await fetchRemote();
    if (remote) {
      saveLocal(Object.assign({}, loadShared(), remote));
      applyState(remote);
    }
  })();

  setInterval(async () => {
    const remote = await fetchRemote();
    if (!remote) return;
    saveLocal(Object.assign({}, loadShared(), remote));
    applyState(remote);
  }, 1500);

  function updateClock() {
    const now = new Date();
    document.getElementById("datetime").textContent = new Intl.DateTimeFormat("zh-TW", {
      timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    }).format(now);
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
