<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>學生議會直播 - 表決畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional" rel="stylesheet">
<style>
  :root {
    --paper-alt: #fdfbf6;
    --ink: #2a2420;
    --wine: #7a2e2e;
    --wine-dark: #591f1f;
    --forest: #3f4d3a;
    --gold: #b08d57;
    --border-soft: #e4dac9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    overflow: auto;
    background: transparent;
    font-family: "Noto Serif TC", serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: relative; width: 100%; height: 100%; }

  #brand {
    position: absolute; top: 40px; right: 48px;
    display: flex; flex-direction: column; align-items: flex-end;
    background: rgba(42,20,20,0.55);
    padding: 14px 26px;
    border-radius: 8px;
    border: 1px solid rgba(176,141,87,0.5);
  }
  #brand .thusp-word {
    font-family: "EB Garamond", serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.32em;
    color: var(--gold);
  }
  #brand .brand-rule {
    width: 60px; height: 1px;
    background: var(--gold);
    opacity: 0.6;
    margin: 6px 0 4px;
  }
  #brand .brand-text {
    color: var(--paper-alt); font-family: "Noto Sans TC", sans-serif;
    font-weight: 600;
    font-size: 18px; letter-spacing: 0.06em; white-space: nowrap;
  }

  #agendaBanner {
    position: absolute; top: 40px; left: 48px; right: 460px;
    background: rgba(42,20,20,0.85);
    border-left: 4px solid var(--gold);
    padding: 14px 24px;
    border-radius: 4px;
  }
  #agendaTitle {
    color: var(--paper-alt);
    font-family: "Noto Sans TC", sans-serif;
    font-size: 27px; font-weight: 700;
    outline: none;
  }

  #voteBoxes {
    position: absolute;
    right: 40px; bottom: 124px;
    display: flex; gap: 40px;
  }
  .vote-box {
    background: var(--gold);
    border-radius: 8px;
    padding: 20px 44px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
    position: relative;
  }
  .vote-box .label {
    font-family: "Noto Sans TC", sans-serif;
    font-size: 30px; font-weight: 700; color: var(--wine-dark);
    outline: none;
  }
  .vote-box .label.clickable {
    cursor: pointer;
    user-select: none;
  }
  .vote-box .label.clickable:hover {
    text-decoration: underline;
    text-underline-offset: 6px;
  }
  .vote-box .count {
    font-family: "EB Garamond", serif;
    font-size: 76px; font-weight: 700; color: var(--ink);
    outline: none;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-top: 6px;
  }
  .vote-box .unit {
    font-size: 22px; color: var(--ink); margin-left: 4px;
  }

  #stamp {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    font-family: "Noto Sans TC", sans-serif;
    font-weight: 700;
    font-size: 44px;
    padding: 10px 30px;
    border: 5px solid currentColor;
    border-radius: 6px;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 250ms ease, transform 250ms ease;
    cursor: pointer;
    user-select: none;
  }
  #stamp.show { opacity: 0.92; pointer-events: auto; }
  #stamp.pass { color: var(--forest); background: rgba(63,77,58,0.08); }
  #stamp.fail { color: var(--wine); background: rgba(122,46,46,0.08); }

  #bottomStack {
    position: absolute; left: 0; right: 0; bottom: 0;
  }
  .info-bar {
    background: linear-gradient(180deg, rgba(89,31,31,0.97) 0%, rgba(42,20,20,0.97) 100%);
    height: 96px;
    display: flex; align-items: center;
    padding: 0 40px; gap: 32px;
  }
  .clock {
    font-family: "EB Garamond", serif;
    font-variant-numeric: tabular-nums;
    font-size: 46px; font-weight: 700; color: var(--paper-alt);
    min-width: 210px;
  }
  .v-div { width: 1px; height: 44px; background: rgba(176,141,87,0.4); }
  .agenda-text {
    flex: 1; font-family: "Noto Sans TC", sans-serif;
    font-size: 30px; font-weight: 700; color: var(--paper-alt); outline: none;
  }
  .live-dot {
    display: flex; align-items: center; gap: 10px;
    font-family: "EB Garamond", serif; font-size: 22px; letter-spacing: 0.16em; color: var(--paper-alt);
  }
  .live-dot .dot {
    width: 14px; height: 14px; border-radius: 50%; background: #c0392b;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  [contenteditable="true"] { cursor: text; border-radius: 4px; padding: 2px 6px; margin: -2px -6px; }
  [contenteditable="true"]:hover { background: rgba(176,141,87,0.15); }
  [contenteditable="true"]:focus {
    background: rgba(176,141,87,0.25);
    box-shadow: 0 0 0 1px rgba(176,141,87,0.6);
  }
  .flash { animation: flash-update 900ms ease; }
  @keyframes flash-update { 0% { color: #ffe9b3; } 100% { color: inherit; } }


</style>
</head>
<body>
<div id="stage">

  <div id="brand">
    <span class="thusp-word">THUSP</span>
    <span class="brand-rule"></span>
    <span class="brand-text">東海大學第三十八屆學生議會</span>
  </div>

  <div id="agendaBanner">
    <div id="agendaTitle" contenteditable="true" spellcheck="false">擬請學生議會同意任命○○部部長</div>
  </div>

  <div id="voteBoxes">
    <div class="vote-box">
      <div class="label clickable" id="agreeLabel">同意</div>
      <div><span class="count" id="agreeCount" contenteditable="true" spellcheck="false">0</span><span class="unit">人</span></div>
      <div id="stamp">通過</div>
    </div>
    <div class="vote-box">
      <div class="label clickable" id="disagreeLabel">不同意</div>
      <div><span class="count" id="disagreeCount" contenteditable="true" spellcheck="false">0</span><span class="unit">人</span></div>
    </div>
    <div class="vote-box">
      <div class="label">廢票</div>
      <div><span class="count" id="spoiledCount" contenteditable="true" spellcheck="false">0</span><span class="unit">人</span></div>
    </div>
  </div>

  <div id="bottomStack">
    <div class="info-bar">
      <div class="clock" id="datetime"></div>
      <div class="v-div"></div>
      <div class="agenda-text" id="agendaBottomText" contenteditable="true" spellcheck="false">表決中</div>
      <div class="live-dot"><span class="dot"></span>LIVE</div>
    </div>
  </div>

</div>

<script>
  const STORAGE_KEY = "thu-council-live-v1";
  const API_URL = "/api/live-state";

  function loadShared() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveLocal(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  async function fetchRemote() {
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }
  function postRemote(patch) {
    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch),
    }).catch(() => {});
  }
  function saveShared(patch) {
    const state = loadShared();
    Object.assign(state, patch);
    saveLocal(state);
    postRemote(patch);
  }

  const editableIds = ["agendaTitle", "agreeCount", "disagreeCount", "spoiledCount", "agendaBottomText"];
  const state = loadShared();
  editableIds.forEach((id) => {
    const key = "vote_" + id;
    if (state[key] !== undefined) document.getElementById(id).textContent = state[key];
  });

  editableIds.forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener("blur", () => {
      saveShared({ ["vote_" + id]: el.textContent });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });
  });

  // stamp: click 同意 to show 通過, click 不同意 to show 不通過; clicking the
  // same one again (or the stamp itself) resets it back to hidden
  const stampLabels = { pass: "通過", fail: "不通過" };
  let stampState = state.vote_stampState || "none";
  const stampEl = document.getElementById("stamp");
  function renderStamp() {
    stampEl.classList.remove("show", "pass", "fail");
    if (stampState !== "none") {
      stampEl.textContent = stampLabels[stampState];
      stampEl.classList.add("show", stampState);
    }
  }
  function setStamp(next) {
    stampState = stampState === next ? "none" : next;
    renderStamp();
    saveShared({ vote_stampState: stampState });
  }
  renderStamp();
  document.getElementById("agreeLabel").addEventListener("click", () => setStamp("pass"));
  document.getElementById("disagreeLabel").addEventListener("click", () => setStamp("fail"));
  stampEl.addEventListener("click", () => setStamp("none"));

  function applyState(s) {
    editableIds.forEach((id) => {
      const el = document.getElementById(id);
      const key = "vote_" + id;
      if (s[key] !== undefined && document.activeElement !== el && el.textContent !== s[key]) {
        el.textContent = s[key];
      }
    });
    if (s.vote_stampState !== undefined && s.vote_stampState !== stampState) {
      stampState = s.vote_stampState;
      renderStamp();
    }
  }

  (async () => {
    const remote = await fetchRemote();
    if (remote) {
      saveLocal(Object.assign({}, loadShared(), remote));
      applyState(remote);
    }
  })();

  setInterval(async () => {
    const remote = await fetchRemote();
    if (!remote) return;
    saveLocal(Object.assign({}, loadShared(), remote));
    applyState(remote);
  }, 1500);

  function updateClock() {
    const now = new Date();
    document.getElementById("datetime").textContent = new Intl.DateTimeFormat("zh-TW", {
      timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
    }).format(now);
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
